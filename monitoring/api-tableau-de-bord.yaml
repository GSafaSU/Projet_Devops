# Le tableau de bord de l'API, décrit en JSON : Grafana le charge tout seul
apiVersion: v1
kind: ConfigMap
metadata:
  name: tableau-de-bord-api
  labels:
    # Grafana charge chaque ConfigMap qui porte cette étiquette, dans tous les namespaces
    grafana_dashboard: "1"
data:
  tp-devops-api.json: |
    {
      "uid": "tp-devops-api",
      "title": "TP DevOps : l'API",
      "tags": ["tp-devops"],
      "schemaVersion": 41,
      "time": {"from": "now-15m", "to": "now"},
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requêtes par seconde, par route",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "targets": [
            {"refId": "A", "expr": "sum by (handler) (rate(http_requests_total{job=\"api\"}[1m]))", "legendFormat": "{{handler}}"}
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Erreurs serveur (5xx), en % des requêtes hors sondes",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0}, "overrides": []},
          "targets": [
            {"refId": "A", "expr": "100 * (sum(rate(http_requests_total{job=\"api\", status=\"5xx\", handler!~\"/health|/ready\"}[1m])) or vector(0)) / sum(rate(http_requests_total{job=\"api\", handler!~\"/health|/ready\"}[1m]))", "legendFormat": "5xx"}
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Latence au 95e centile",
          "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "targets": [
            {"refId": "A", "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_highr_seconds_bucket{job=\"api\"}[1m])))", "legendFormat": "p95"}
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Pods de l'API : voulus et prêts",
          "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "none", "min": 0, "decimals": 0}, "overrides": []},
          "targets": [
            {"refId": "A", "expr": "kube_deployment_spec_replicas{namespace=\"default\", deployment=\"api\"}", "legendFormat": "voulus"},
            {"refId": "B", "expr": "kube_deployment_status_replicas_available{namespace=\"default\", deployment=\"api\"}", "legendFormat": "prêts"}
          ]
        }
      ]
    }