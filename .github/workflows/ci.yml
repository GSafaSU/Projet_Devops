# Le pipeline CI/CD : GitHub l'exécute à chaque push sur main et à chaque pull request
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Par défaut, le jeton de GitHub ne peut que lire le dépôt ; publish demandera davantage
permissions:
  contents: read

jobs:

  # Job 1 : construire l'image une seule fois, puis la transmettre aux autres jobs
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v7

      - name: Construire l'image et l'exporter dans une archive
        run: |
          docker build -t tp-devops-api:ci .
          docker save tp-devops-api:ci -o image.tar

      - name: Transmettre l'archive aux jobs suivants
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: image.tar
          retention-days: 1

  # Job 2 : cette image, déployée avec tes manifestes, passe-t-elle les tests d'acceptation ?
  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v7

      - name: Récupérer l'archive de l'image
        uses: actions/download-artifact@v8
        with:
          name: image

      - name: Installer Kind et kubectl, en versions fixées et vérifiées
        run: |
          curl -fsSLO https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -fsSLO https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum
          sha256sum -c kind-linux-amd64.sha256sum
          curl -fsSLO https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl
          curl -fsSLO https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
          chmod +x kind-linux-amd64 kubectl
          sudo mv kind-linux-amd64 /usr/local/bin/kind
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Créer un cluster jetable, avec la configuration de ton PC
        run: kind create cluster --name tp-devops --config kind-config.yaml --wait 120s

      - name: Charger l'image dans les nœuds du cluster
        run: kind load image-archive image.tar --name tp-devops

      - name: Déployer l'application avec tes manifestes
        run: |
          kubectl create secret generic db-secret --from-literal=DB_PASSWORD=mot-de-passe-de-test
          kubectl apply -f k8s/db.yaml
          # api.yaml tel quel, sauf l'image : celle qu'on vient de construire
          sed 's|image: .*|image: tp-devops-api:ci|' k8s/api.yaml | kubectl apply -f -
          kubectl rollout status deployment/db --timeout=180s
          kubectl rollout status deployment/api --timeout=180s

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer Robot Framework
        run: pip install -r tests/requirements.txt

      - name: Tests d'acceptation
        run: robot --outputdir resultats tests/

      - name: Garder le rapport des tests, même en cas d'échec
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-robot
          path: resultats/
          retention-days: 7

      - name: Afficher l'état du cluster en cas d'échec
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods
          kubectl logs -l app=api --prefix --tail=50
          kubectl logs deployment/db --tail=50

  # Job 3 : publier exactement l'image testée, si le test a réussi, et seulement sur main
  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer l'archive de l'image
        uses: actions/download-artifact@v8
        with:
          name: image

      - name: Se connecter au registre ghcr.io
        env:
          JETON: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$JETON" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Étiqueter l'image testée et la publier
        run: |
          docker load -i image.tar
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}"
          docker tag tp-devops-api:ci "$IMAGE"
          docker push "$IMAGE"
          echo "Image publiée : $IMAGE"