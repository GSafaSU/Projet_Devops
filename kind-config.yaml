# Le cluster Kind du TP : un nœud de contrôle et deux nœuds de travail
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # Le port 30080 du PC mène au port 30080 du nœud, celui du Service de l'API
      - containerPort: 30080
        hostPort: 30080
        listenAddress: "127.0.0.1"
  - role: worker
  - role: worker